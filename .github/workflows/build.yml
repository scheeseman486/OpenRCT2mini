name: Build OpenRCT2mini

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # required for creating releases on tag
  packages: read

jobs:
  build-arm:
    name: Cross-build for Miyoo Mini (armhf)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need the full short commit, not the merge commit, in the
          # archive name and the version banner.
          fetch-depth: 1

      # The four generated .dat files (g2 / fonts / palettes / tracks) are
      # built by openrct2-cli at host architecture. The cross-build can't
      # run that cli, so we produce just the .dat files first via a host
      # build. These assets are OpenRCT2-original, GPL-licensed sprites
      # (resources/{g2,fonts,palettes,tracks}/*.png + .json) — not RCT2
      # game data. package.sh's "stage 2a" picks them up from build-host/.
      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libsdl2-dev libpng-dev libzip-dev libzstd-dev \
            libvorbis-dev libogg-dev nlohmann-json3-dev \
            p7zip-full python3-pil

      - name: Host build (graphics target only — produces *.dat)
        # Demote -Werror for this throwaway host build. The GH runner's GCC
        # is stricter about -Wnull-dereference / -Warray-bounds than what
        # upstream OpenRCT2 was last tested against; the actual code paths
        # are guarded by explicit nullptr checks. We're not shipping this
        # host binary — only consuming its generated .dat blobs — so
        # source-level fixes for upstream warnings would be a wasted PR.
        run: |
          cmake -S . -B build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_CXX_FLAGS="-Wno-error=null-dereference -Wno-error=array-bounds -Wno-error=stringop-overflow -Wno-error=stringop-overread -Wno-error=dangling-reference -Wno-error=maybe-uninitialized" \
            -DDISABLE_NETWORK=ON -DDISABLE_HTTP=ON -DDISABLE_OPENGL=ON \
            -DDISABLE_TTF=ON -DDISABLE_FLAC=ON -DDISABLE_DISCORD_RPC=ON \
            -DDISABLE_GOOGLE_BENCHMARK=ON -DDISABLE_VERSION_CHECKER=ON \
            -DENABLE_SCRIPTING=OFF -DDISABLE_ICU=ON \
            -DDOWNLOAD_TITLE_SEQUENCES=OFF -DDOWNLOAD_OBJECTS=OFF \
            -DDOWNLOAD_OPENSFX=OFF -DDOWNLOAD_OPENMUSIC=OFF \
            -DOPENRCT2_USE_CCACHE=OFF
          cmake --build build-host --target graphics
          ls -la build-host/*.dat

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the toolchain image with GHA's docker layer cache. The first
      # run takes ~10 min (downloads + builds libzstd / libogg / libvorbis /
      # libzip / nlohmann-json / vendor SDL2 inside the image). Subsequent
      # runs reuse the cached layers and finish in seconds unless
      # build-deps.sh or the Dockerfile changed.
      - name: Build toolchain image
        uses: docker/build-push-action@v5
        with:
          context: Packaging/miyoo_mini
          file: Packaging/miyoo_mini/Dockerfile
          tags: openrctmini-toolchain:latest
          load: true              # leave the image in the local docker daemon
          push: false             # don't publish — the image is huge and only useful to this workflow
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the cross-build inside the image. We bypass build.sh's first
      # stage (image build) since the docker/build-push-action above
      # already produced a tagged local image; build.sh would skip stage
      # 1 anyway when the image exists.
      - name: Cross-compile openrct2 for armhf
        run: |
          ./Packaging/miyoo_mini/build.sh

      - name: Inspect the produced binary
        run: |
          ls -la build-arm/openrct2
          file build-arm/openrct2
          echo "Port archive:"
          ls -la dist/OpenRCT2mini-*.7z

      - name: Upload port archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRCT2mini-armhf-${{ github.sha }}
          path: dist/OpenRCT2mini-*.7z
          if-no-files-found: error
          retention-days: 30

      # On a v* tag, also publish a GitHub Release with the port archive attached.
      # Body comes from release-notes-<tag>.md if present, otherwise GitHub
      # auto-generates from commits.
      - name: Resolve release body path
        if: startsWith(github.ref, 'refs/tags/v')
        id: relbody
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ -f "release-notes-${tag}.md" ]; then
              echo "path=release-notes-${tag}.md" >> "$GITHUB_OUTPUT"
              echo "Using release-notes-${tag}.md"
          else
              echo "path=" >> "$GITHUB_OUTPUT"
              echo "No release-notes-${tag}.md — falling back to auto-generated notes."
          fi

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenRCT2mini-*.7z
          body_path: ${{ steps.relbody.outputs.path }}
          generate_release_notes: ${{ steps.relbody.outputs.path == '' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-appimage-x86-64:
    name: Build x86_64 Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # AppImage build needs the same .dat files the ARM build needs
      # (g2 / fonts / palettes / tracks). The CMake install rule for
      # the AppImage will hit them via the build target, so we build
      # them here separately first. We duplicate the recipe rather
      # than depend on the ARM job's output — GHA composite actions
      # have their own caching cliffs and the two jobs aren't going
      # to drift apart soon.
      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libsdl2-dev libpng-dev libzip-dev libzstd-dev \
            libvorbis-dev libogg-dev nlohmann-json3-dev \
            p7zip-full python3-pil

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the AppImage toolchain image with GHA layer cache.
      # First run downloads Ubuntu 22.04 + apt-installs ~600 MB of dev
      # deps + downloads linuxdeploy; subsequent runs reuse cached
      # layers and finish in seconds unless Dockerfile changed.
      - name: Build AppImage toolchain image
        uses: docker/build-push-action@v5
        with:
          context: Packaging/appimage
          file: Packaging/appimage/Dockerfile
          tags: openrctmini-appimage:latest
          load: true
          push: false
          cache-from: type=gha,scope=appimage
          cache-to: type=gha,mode=max,scope=appimage

      # Run the AppImage build inside the image. build.sh handles cmake
      # configure + make install DESTDIR=AppDir + linuxdeploy invocation.
      # It also calls package.sh at the end (which zips the AppImage
      # with a readme + LICENSE for end-user delivery).
      - name: Build OpenRCT2mini x86_64 AppImage
        run: |
          ./Packaging/appimage/build.sh

      - name: Inspect the produced artifacts
        run: |
          ls -la dist/
          file dist/OpenRCT2mini-*-x86_64.AppImage
          echo "Portable zip:"
          ls -la dist/OpenRCT2mini-x86_64-*.zip

      - name: Upload portable zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRCT2mini-x86_64-${{ github.sha }}
          path: dist/OpenRCT2mini-x86_64-*.zip
          if-no-files-found: error
          retention-days: 30

      # Same release-on-tag flow as the ARM job. softprops/action-gh-
      # release is idempotent on the tag — if the release already
      # exists (created by the ARM job), this appends to its files
      # list rather than failing.
      - name: Resolve release body path
        if: startsWith(github.ref, 'refs/tags/v')
        id: relbody
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ -f "release-notes-${tag}.md" ]; then
              echo "path=release-notes-${tag}.md" >> "$GITHUB_OUTPUT"
              echo "Using release-notes-${tag}.md"
          else
              echo "path=" >> "$GITHUB_OUTPUT"
              echo "No release-notes-${tag}.md — falling back to auto-generated notes."
          fi

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenRCT2mini-x86_64-*.zip
          body_path: ${{ steps.relbody.outputs.path }}
          generate_release_notes: ${{ steps.relbody.outputs.path == '' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-x64:
    name: Cross-build for Windows x64 (mingw-w64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Same host graphics step as the ARM and AppImage jobs — the cross
      # build can't run openrct2-cli (it's a .exe), so the .dat files are
      # produced by a native host build first. We duplicate the recipe
      # rather than pass artefacts between GHA jobs to keep each job
      # independent and rebuild-able in isolation.
      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            libsdl2-dev libpng-dev libzip-dev libzstd-dev \
            libvorbis-dev libogg-dev nlohmann-json3-dev \
            p7zip-full python3-pil

      - name: Host build (graphics target only — produces *.dat)
        run: |
          cmake -S . -B build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_CXX_FLAGS="-Wno-error=null-dereference -Wno-error=array-bounds -Wno-error=stringop-overflow -Wno-error=stringop-overread -Wno-error=dangling-reference -Wno-error=maybe-uninitialized" \
            -DDISABLE_NETWORK=ON -DDISABLE_HTTP=ON -DDISABLE_OPENGL=ON \
            -DDISABLE_TTF=ON -DDISABLE_FLAC=ON -DDISABLE_DISCORD_RPC=ON \
            -DDISABLE_GOOGLE_BENCHMARK=ON -DDISABLE_VERSION_CHECKER=ON \
            -DENABLE_SCRIPTING=OFF -DDISABLE_ICU=ON \
            -DDOWNLOAD_TITLE_SEQUENCES=OFF -DDOWNLOAD_OBJECTS=OFF \
            -DDOWNLOAD_OPENSFX=OFF -DDOWNLOAD_OPENMUSIC=OFF \
            -DOPENRCT2_USE_CCACHE=OFF
          cmake --build build-host --target graphics
          ls -la build-host/*.dat

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # First-run builds the mingw-w64 cross-toolchain image (~10 min for
      # the apt install + inline cross-build of SDL2/png/zlib/zstd/vorbis/
      # ogg/flac/freetype/zip/nlohmann_json into /opt/mingw-sysroot/).
      # Subsequent runs reuse the cached layers via type=gha (scope=windows
      # so it doesn't collide with the appimage scope).
      - name: Build Windows cross-toolchain image
        uses: docker/build-push-action@v5
        with:
          context: Packaging/windows
          file: Packaging/windows/Dockerfile
          tags: openrctmini-windows-cross:latest
          load: true
          push: false
          cache-from: type=gha,scope=windows
          cache-to: type=gha,mode=max,scope=windows

      # Run the cross-build. --skip-host-graphics because we already
      # produced the .dat files above (build-host/ is shared via the
      # bind mount that build.sh sets up automatically).
      - name: Cross-compile openrct2 for x86_64-windows
        run: |
          ./Packaging/windows/build.sh --skip-host-graphics

      - name: Inspect the produced artifacts
        run: |
          ls -la dist/
          file dist/OpenRCT2mini-x64/openrct2.exe
          ls -la dist/OpenRCT2mini-*-x64.zip

      - name: Upload portable zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRCT2mini-x64-${{ github.sha }}
          path: dist/OpenRCT2mini-*-x64.zip
          if-no-files-found: error
          retention-days: 30

      # Idempotent release-on-tag flow — softprops/action-gh-release
      # appends to the existing release on the tag if one already
      # exists (created by the ARM or AppImage job that ran first).
      - name: Resolve release body path
        if: startsWith(github.ref, 'refs/tags/v')
        id: relbody
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [ -f "release-notes-${tag}.md" ]; then
              echo "path=release-notes-${tag}.md" >> "$GITHUB_OUTPUT"
              echo "Using release-notes-${tag}.md"
          else
              echo "path=" >> "$GITHUB_OUTPUT"
              echo "No release-notes-${tag}.md — falling back to auto-generated notes."
          fi

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenRCT2mini-*-x64.zip
          body_path: ${{ steps.relbody.outputs.path }}
          generate_release_notes: ${{ steps.relbody.outputs.path == '' }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
